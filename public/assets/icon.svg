<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="32 32 448 448">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C026D3"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="topSheen" cx="50%" cy="12%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#2E1065" flood-opacity="0.6"/>
    </filter>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#F472B6" flood-opacity="0.75"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#topSheen)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#specularRim)" stroke-width="2"/>
  <g transform="translate(-102.400 -102.400) scale(1.4)">
<g filter="url(#shadow)">
    <!-- Outer Telemetry Gauge Track: Radius 144 -->
    <circle cx="256" cy="260" r="144" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5" stroke-dasharray="3 9"/>
    <!-- 72% Capacity Metric Arc: 2*PI*144 ≈ 904.78. 0.72 of 904.78 ≈ 651 -->
    <circle cx="256" cy="260" r="144" fill="none" stroke="#F472B6" stroke-width="7" stroke-linecap="round"
            stroke-dasharray="651 904.78" transform="rotate(-135 256 260)" filter="url(#neonGlow)"/>

    <!-- Inner Secondary Meter (Radius 116) -->
    <circle cx="256" cy="260" r="116" fill="none" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" stroke-dasharray="360 728" transform="rotate(45 256 260)"/>

    <!-- Central Neural AI Core Chip -->
    <rect x="206" y="210" width="100" height="100" rx="22" fill="#FFFFFF"/>
    <!-- Glowing AI Starburst in Center -->
    <path d="M 256, 226 Q 256, 260 290, 260 Q 256, 260 256, 294 Q 256, 260 222, 260 Q 256, 260 256, 226 Z"
          fill="#8B5CF6"/>
    <circle cx="256" cy="260" r="6" fill="#F472B6"/>
  </g>
  </g>
</svg>